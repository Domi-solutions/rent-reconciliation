<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tenant Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="viewer-header">
    <div style="max-width: 860px; margin: 0 auto; padding: 0 20px;">
      <div style="padding: 12px 0 4px;">
        <div class="viewer-prop-name">{{ property.name }}</div>
        <div class="viewer-prop-label">Unit {{ unit.unit_number }} — {{ tenant.name }}</div>
      </div>
      <nav style="display: flex; gap: 4px; padding-bottom: 8px; overflow-x: auto;">
        <a class="viewer-nav-tab {% if active_tab == 'portal' %}active{% endif %}" href="{{ url_for('tenant.portal', token=token) }}">Overview</a>
        <a class="viewer-nav-tab {% if active_tab == 'charges' %}active{% endif %}" href="{{ url_for('tenant.charges', token=token) }}">Charges</a>
        <a class="viewer-nav-tab {% if active_tab == 'payments' %}active{% endif %}" href="{{ url_for('tenant.payments', token=token) }}">Payments</a>
        <a class="viewer-nav-tab {% if active_tab == 'messages' %}active{% endif %}" href="{{ url_for('tenant.messages', token=token) }}">Messages</a>
        <a class="viewer-nav-tab {% if active_tab == 'maintenance' %}active{% endif %}" href="{{ url_for('tenant.maintenance', token=token) }}">Maintenance</a>
        <a class="viewer-nav-tab {% if active_tab == 'pay' %}active{% endif %}" href="{{ url_for('tenant.pay', token=token) }}">Pay</a>
      </nav>
    </div>
  </header>
  <main style="max-width: 860px; margin: 0 auto; padding: 24px 20px 48px;">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
