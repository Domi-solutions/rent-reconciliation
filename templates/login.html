<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Domi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f8fa; }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,.08); padding: 40px 36px; width: 100%; max-width: 400px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-mark { width: 48px; height: 48px; background: #1a1a2e; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .brand-mark span { color: #fff; font-size: 22px; font-weight: 700; }
    .brand-name { font-size: 20px; font-weight: 700; color: #1a1a2e; }
    .brand-tagline { font-size: 13px; color: #8a94a6; margin-top: 2px; }
    .form-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-control { border-radius: 10px; border: 1.5px solid #e5e7eb; padding: 11px 14px; font-size: 14px; transition: border-color .15s; }
    .form-control:focus { border-color: #1a1a2e; box-shadow: 0 0 0 3px rgba(26,26,46,.08); }
    .btn-signin { background: #1a1a2e; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; width: 100%; transition: opacity .15s; }
    .btn-signin:hover { opacity: .88; color: #fff; }
    .error-box { background: #fff1f0; border: 1px solid #fca5a5; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #b91c1c; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark"><span>D</span></div>
        <div class="brand-name">Domi</div>
        <div class="brand-tagline">Property intelligence platform</div>
      </div>

      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          {# Not required: the ADMIN_PASSWORD master key is the way back in when
             the org password is lost, and it does not use the email. Marking
             this required blocked the one route that exists for that. #}
          <input type="email" name="email" class="form-control" placeholder="you@example.com" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-signin">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
