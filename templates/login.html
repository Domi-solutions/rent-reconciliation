<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Domi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 400px;">
    <div class="text-center mb-4">
      <div style="font-size: 22px; font-weight: 700;">Domi</div>
      <div style="font-size: 13px; color: #718096; margin-top: 4px;">Property management</div>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        <form method="POST">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          {% if orgs %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Organisation</label>
            <select name="org_id" class="form-select" required>
              <option value="">— Select your organisation —</option>
              {% for org in orgs %}
              <option value="{{ org.id }}">{{ org.name }}</option>
              {% endfor %}
            </select>
          </div>
          {% endif %}

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
