<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Organisation — Domi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
      <div style="font-size: 22px; font-weight: 700;">Domi</div>
      <div style="font-size: 14px; color: #718096; margin-top: 4px;">Select your organisation to continue</div>
    </div>

    <div class="d-flex flex-column gap-3">
      {% for org in orgs %}
      <form method="POST">
        <input type="hidden" name="org_id" value="{{ org.id }}">
        <button type="submit" class="btn btn-outline-primary w-100 text-start p-3" style="border-radius: 8px;">
          <div style="font-weight: 600; font-size: 15px;">{{ org.name }}</div>
          {% if org.slug %}<div style="font-size: 12px; color: #718096;">{{ org.slug }}</div>{% endif %}
        </button>
      </form>
      {% endfor %}
    </div>

    <div class="text-center mt-4">
      <a href="{{ url_for('admin_logout') }}" style="font-size: 13px; color: #a0aec0;">Log out</a>
    </div>
  </div>
</body>
</html>
