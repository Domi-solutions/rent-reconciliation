{# One stroke family; symbols are plain SVG and need no external font or script. #}
{% macro icon(name, size=18) -%}
<svg class="domi-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'person' %}<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M19 7v6m-3-3h6"/>
{% elif name == 'more' %}<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
{% elif name == 'home' %}<path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/>
{% elif name == 'building' %}<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h1m4 0h1M9 11h1m4 0h1M10 21v-6h4v6"/>
{% elif name == 'phone' %}<path d="m8 3 3 5-3 2a14 14 0 0 0 6 6l2-3 5 3v3a2 2 0 0 1-2 2C9 21 3 15 3 5a2 2 0 0 1 2-2z"/>
{% elif name == 'file' %}<path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8m-8 4h6"/>
{% elif name == 'wallet' %}<path d="M20 7V5H4a1 1 0 0 1 0-2h13v4M4 7h17v14H4a2 2 0 0 1-2-2V5M21 12h-6v5h6"/><path d="M17 14.5h.01"/>
{% elif name == 'warning' %}<path d="m12 3 10 18H2zM12 9v5m0 3h.01"/>
{% elif name == 'message' %}<path d="M21 16a2 2 0 0 1-2 2H8l-5 3V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2zM7 8h10M7 12h7"/>
{% elif name == 'receipt' %}<path d="m5 3 3 2 4-2 4 2 3-2v18l-3-2-4 2-4-2-3 2zM9 9h6m-6 4h6m-6 4h3"/>
{% elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>
{% elif name == 'water' %}<path d="M12 3c-2 4-7 8-7 12a7 7 0 0 0 14 0c0-4-5-8-7-12zM8 15a4 4 0 0 0 4 4"/>
{% elif name == 'chart' %}<path d="M4 3v18h17M8 16v-4m5 4V8m5 8V5"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h3m4 0h3"/>
{% elif name == 'users' %}<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v3"/>
{% elif name == 'user' %}<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'settings' %}<path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'wrench' %}<path d="M21 3a6 6 0 0 1-8 8L5 21l-3-3 10-8a6 6 0 0 1 8-8l-4 4 2 2z"/>
{% elif name == 'logout' %}<path d="M9 3H3v18h6m6-15 6 6-6 6m6-6H9"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'check' %}<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>
{% elif name == 'attachment' %}<path d="m8 12 7-7a3 3 0 0 1 4 4L9 19a5 5 0 0 1-7-7L13 1m-8 14 9-9"/>
{% endif %}</svg>
{%- endmacro %}
