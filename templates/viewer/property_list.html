{% extends "viewer/base_viewer.html" %}
{% block title %}Select Property{% endblock %}
{% block content %}
<h5 class="mb-3">Select Property</h5>
{% if not properties %}
<p class="text-muted">No properties found.</p>
{% else %}
<div class="row g-3">
  {% for p in properties %}
  <div class="col-12 col-md-6">
    <a href="{{ url_for('viewer.property_dashboard', property_id=p.id) }}" class="card text-decoration-none text-dark h-100">
      <div class="card-body">
        <h6 class="card-title mb-1">{{ p.name }}</h6>
        <p class="card-text text-muted small mb-0">{{ p.address or 'No address' }}</p>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
