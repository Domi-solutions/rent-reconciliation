{% extends "base.html" %}
{% block title %}Generate Report - {{ property.name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-8 mx-auto">
    <h4 class="mb-4">Generate Landlord Report</h4>
    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="period_start" class="form-label">Period Start</label>
            <input type="date" class="form-control" id="period_start" name="period_start" 
                   value="{{ default_start }}" required>
          </div>
          <div class="mb-3">
            <label for="period_end" class="form-label">Period End</label>
            <input type="date" class="form-control" id="period_end" name="period_end" 
                   value="{{ default_end }}" required>
          </div>
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Generate Report</button>
          </div>
        </form>
      </div>
    </div>
    <div class="mt-3">
      <small class="text-muted">
        Reports include: collection rate, payments received, charges generated, tenant movement, claim resolution, and arrears snapshot.
      </small>
    </div>
  </div>
</div>
{% endblock %}
