# Domi — Route Registry
# Ground truth for all Flask blueprints and URL prefixes.
# Agents: check this before adding any route to avoid conflicts.
# When adding a blueprint or route: update this file in the same commit.
# status: live = deployed | planned = not yet built

blueprints:

  admin:
    file: app.py (inline routes, no blueprint)
    prefix: /
    auth: session['admin_authenticated']
    status: live
    key_routes:
      - "GET / — dashboard"
      - "GET /properties — property list/selector"
      - "GET /properties/select/<property_id> — set active property"
      - "GET /units — unit list"
      - "GET /tenants — tenant list"
      - "POST /charges/generate — generate rent+service charges"
      - "POST /charges/water — upload water readings"
      - "POST /statements/upload — upload bank statement PDF; optional property_id tag from form; org-scoped under org_id"
      - "GET /statements/<statement_id> — statement detail hub: verified, unmatched, assign, correct, parse errors, audit"
      - "GET /statements/<statement_id>/view — serve stored PDF via send_file() (opens in browser tab)"
      - "POST /statements/<statement_id>/reparse — re-parse stored PDF; clears and rewrites transactions + parse errors"
      - "GET /verify/<statement_id> — run claim verification against this statement; scoped to stmt.property_id if set, else org-wide; redirects to statement_detail"
      - "POST /statements/<statement_id>/auto-assign/<txn_id> — assign via unit_hint from narration; audited as payment_auto_hint_assigned"
      - "POST /statements/<statement_id>/assign/<txn_id> — manual assignment with required reason; audited as payment_manual_assigned"
      - "POST /statements/<statement_id>/correct/<payment_id> — unassign + optional reassign; audited as payment_corrected; claim reverted to pending"
      - "POST /claims/submit — submit M-Pesa claim"
      - "POST /payments/verify — verify claims against bank statement"
      - "GET /owners — owner management"
      - "GET /caretakers — caretaker management"
      - "GET /login — login form"
      - "POST /login — authenticate admin"
      - "GET /logout — clear session"
      - "GET /tools — monthly workflow (tools_index); queries DB for per-step completion timestamps; returns workflow dict + current period for green/red status indicators"

  viewer:
    file: src/routes/viewer_routes.py
    prefix: /view
    auth: session['viewer_authenticated'] + property_owners check
    status: live
    key_routes:
      - "GET /view/ — property list (filtered by owner)"
      - "GET /view/login — viewer login"
      - "POST /view/login — authenticate"
      - "GET /view/<property_id> — owner dashboard"
      - "GET /view/<property_id>/arrears"
      - "GET /view/<property_id>/payments"
      - "GET /view/<property_id>/reports"
      - "GET /view/<property_id>/reports/<report_id>"
      - "GET /view/<property_id>/maintenance"
      - "GET /view/<property_id>/notifications — owner inbox"

  tenant:
    file: src/routes/tenant_routes.py
    prefix: /tenant
    auth: token in URL (access_token column); no session
    status: live
    exempt_from_admin_auth: true
    key_routes:
      - "GET /tenant/<token> — overview"
      - "GET /tenant/<token>/charges"
      - "GET /tenant/<token>/payments"
      - "GET /tenant/<token>/messages"
      - "GET /tenant/<token>/maintenance"
      - "POST /tenant/<token>/maintenance/new"
      - "GET /tenant/<token>/pay — payment tab (PIN-gated)"
      - "POST /tenant/<token>/pay/pin/create — create 4-digit PIN"
      - "POST /tenant/<token>/pay/pin/verify — verify PIN, set session"
      - "POST /tenant/<token>/pay/stk — initiate STK Push"
      - "GET /tenant/<token>/pay/status/<checkout_request_id> — poll payment status (JSON)"

  caretaker:
    file: src/routes/caretaker_routes.py
    prefix: /caretaker
    auth: named DB account (caretakers table) OR CARETAKER_PASSWORD env var
    status: live
    exempt_from_admin_auth: true
    key_routes:
      - "GET /caretaker/login"
      - "POST /caretaker/login"
      - "GET /caretaker/<property_id> — dashboard"
      - "GET /caretaker/<property_id>/arrears"
      - "GET /caretaker/<property_id>/tenants"
      - "GET /caretaker/<property_id>/issues"
      - "POST /caretaker/<property_id>/issues/new"
      - "POST /caretaker/<property_id>/issues/<id>/resolve"
      - "GET /caretaker/<property_id>/log-payment"
      - "POST /caretaker/<property_id>/log-payment"

  messaging:
    file: src/routes/messaging_routes.py
    prefix: /messages
    auth: admin session
    status: live
    key_routes:
      - "GET /messages — messaging dashboard"
      - "GET/POST /messages/broadcast"
      - "GET /messages/templates"
      - "GET/POST /messages/templates/<id>/edit"
      - "GET /messages/reminders"
      - "GET /messages/schedules"

  reports:
    file: src/routes/report_routes.py
    prefix: /reports
    auth: admin session
    status: live
    key_routes:
      - "GET /reports — report history"
      - "GET/POST /reports/generate"
      - "GET /reports/<id>"
      - "GET /reports/<id>/caretaker"

  agent:
    file: src/routes/agent_routes.py
    prefix: /agent
    auth: admin session
    status: live
    key_routes:
      - "GET /agent/simulator — message simulator"
      - "GET /agent/digest/preview/<property_id>"
      - "GET /agent/briefing/caretaker/<property_id>/preview"
      - "GET /agent/briefing/owner/<property_id>/preview"
      - "GET /agent/checklist/<property_id>/preview"
      - "POST /agent/trigger/<job_name> — manual job trigger (dev)"

  test:
    file: src/routes/test_routes.py
    prefix: /test
    auth: none (dev/testing only)
    status: live
    note: "Parser and CRUD testing routes. Remove or gate before multi-client production."

  payment:
    file: src/routes/payment_routes.py
    prefix: /inbound/payment
    auth: none (webhook endpoints — verified by provider signature)
    status: live
    exempt_from_admin_auth: true
    key_routes:
      - "POST /inbound/payment/mpesa — Daraja C2B callback (write-and-return-200)"
      - "POST /inbound/payment/pesapal — Pesapal IPN (write-and-return-200)"

  platform:
    file: src/routes/platform_routes.py
    prefix: /platform
    auth: session['platform_admin'] (PLATFORM_ADMIN_PASSWORD env var)
    status: live
    key_routes:
      - "GET /platform/login"
      - "POST /platform/login"
      - "GET /platform/logout"
      - "GET /platform/ — org list dashboard (property/unit counts, last activity, parse error count)"
      - "GET /platform/errors — platform_errors table (500s, warnings)"
      - "POST /platform/impersonate/<org_id> — sets org session, redirects to /dashboard"
      - "POST /platform/orgs/new — create new organisation"
      - "POST /platform/orgs/<org_id>/toggle — activate / deactivate org"
      - "POST /platform/orgs/<org_id>/set-email — set org login email"
      - "POST /platform/orgs/<org_id>/set-password — set org admin password"
      - "GET /platform/parse-errors — all parse errors across all orgs; ?org_id= filter"
      - "GET /platform/statements/<statement_id>/pdf — serve stored PDF file via send_file()"

  inbound:
    file: src/routes/inbound_routes.py
    prefix: /inbound
    auth: none (webhook endpoints)
    status: live
    exempt_from_admin_auth: true
    note: "Resolves sender identity by phone (caretaker → owner → tenant → unknown). Dispatches process_inbound_message in background thread."
    key_routes:
      - "POST /inbound/sms — Africa's Talking inbound SMS (write-and-return-200)"
      - "POST /inbound/whatsapp — WhatsApp inbound stub (write-and-return-200; full payload parsing when credentials live)"

  platform_guardian_routes:
    note: "New platform oversight routes added to platform_bp in src/routes/platform_routes.py"
    key_routes:
      - "GET /platform/shadow-log — agency-uneditable audit log; ?org_id= filter"
      - "GET /platform/disputes — tenant disputes (open/resolved); POST /platform/disputes/<id>/resolve"
      - "GET /platform/alerts — anomaly alerts (open/dismissed); POST /platform/alerts/<id>/dismiss"
      - "GET /platform/trust — per-agency trust scores (0-100)"

  owner:
    file: src/routes/owner_routes.py
    prefix: /owner
    auth: session['person_id'] + session['person_role'] == 'owner' (persons-based login)
    status: live
    note: "Distinct from /view/* token-based flow. person_id from persons table; bridges into existing viewer by setting session['owner_id']."
    key_routes:
      - "GET /owner/login"
      - "POST /owner/login — authenticate via persons.phone + password_hash"
      - "GET /owner/logout"
      - "GET /owner/dashboard — portfolio view across all owned properties (occupancy, arrears, collection rate)"
      - "GET /owner/<property_id>/ — verify ownership then redirect into /view/<property_id>"

  viewer_wallet:
    note: "Owner wallet tab in viewer blueprint. Full payout account management with OTP + 48h hold security model. Admin cannot set payout_mpesa — owner-only via portal."
    key_routes:
      - "GET /view/<property_id>/wallet — balance, fee, disbursement history; payout account status (unset/pending_otp/hold/active)"
      - "POST /view/<property_id>/payout/request-otp — owner submits M-Pesa number; normalizes to +2547XX; generates 6-digit OTP; sends via SMS; stores in owners.payout_otp with 10-min expiry"
      - "POST /view/<property_id>/payout/confirm-otp — verifies OTP; sets payout_confirmed=1 + payout_active_at=now+48h; platform_log + critical alert; SMS warning to old number if previously set"

  tenant_dispute:
    note: "Dispute submission added to tenant blueprint in src/routes/tenant_routes.py"
    key_routes:
      - "POST /tenant/<token>/dispute — tenant raises concern; writes to tenant_disputes; goes to platform not agency"
