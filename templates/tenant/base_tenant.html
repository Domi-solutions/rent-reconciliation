<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tenant Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .doc { background:#fff; border:1px solid #e7e6e1; border-radius:14px; padding:18px; margin-bottom:16px; }
    .doc h2 { font-size:18px; font-weight:700; margin:0 0 2px; }
    .doc .muted { color:#8a8a84; font-size:13px; }
    .doc table { width:100%; border-collapse:collapse; font-size:14px; }
    .doc td { padding:9px 4px; border-top:1px solid #efeee9; vertical-align:top; }
    .doc td.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .doc tr.total td { font-weight:700; border-top:2px solid #1b1b1a; }
    .chip { display:inline-block; padding:6px 12px; border:1px solid #d9d8d2; border-radius:999px; font-size:13px; margin:0 6px 8px 0; text-decoration:none; color:#1b1b1a; }
    .big { font-size:30px; font-weight:700; letter-spacing:-.01em; }
    .owed { color:#b91c1c; } .credit { color:#1e7a35; }
    .print-btn { border:1px solid #1b1b1a; background:#fff; border-radius:10px; padding:8px 14px; font-size:14px; }
    @media print { .viewer-header nav, .no-print { display:none !important; } .doc { border:none; padding:0; } body { background:#fff; } }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="viewer-header">
    <div style="max-width: 860px; margin: 0 auto; padding: 0 20px;">
      <div style="padding: 12px 0 4px;">
        <div class="viewer-prop-name">{{ property.name|title }}</div>
        <div class="viewer-prop-label">Unit {{ unit.unit_number }} — {{ tenant.name|title }}</div>
      </div>
      <nav style="display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px;">
        <a class="viewer-nav-tab {% if active_tab == 'portal' %}active{% endif %}" href="{{ url_for('tenant.portal', token=token) }}">Overview</a>
        <a class="viewer-nav-tab {% if active_tab == 'pay' %}active{% endif %}" href="{{ url_for('tenant.pay', token=token) }}" style="font-weight:600">Pay</a>
        <a class="viewer-nav-tab {% if active_tab == 'statement' %}active{% endif %}" href="{{ url_for('tenant.statement', token=token) }}">Statement</a>
        <a class="viewer-nav-tab {% if active_tab == 'messages' %}active{% endif %}" href="{{ url_for('tenant.messages', token=token) }}">Messages</a>
        <a class="viewer-nav-tab {% if active_tab == 'maintenance' %}active{% endif %}" href="{{ url_for('tenant.maintenance', token=token) }}">Repairs</a>
        <a class="viewer-nav-tab {% if active_tab == 'charges' %}active{% endif %}" href="{{ url_for('tenant.charges', token=token) }}">Charges</a>
        <a class="viewer-nav-tab {% if active_tab == 'payments' %}active{% endif %}" href="{{ url_for('tenant.payments', token=token) }}">Payments</a>
        <a class="viewer-nav-tab" style="margin-left:auto" href="{{ url_for('tenant.logout') }}">Sign out</a>
      </nav>
    </div>
  </header>
  <main style="max-width: 860px; margin: 0 auto; padding: 24px 20px 48px;">
    {% include 'partials/guide.html' %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
