{% extends "caretaker/base_caretaker.html" %}
{% block title %}Log Payment — {{ property.name }}{% endblock %}

{% block content %}
<div style="max-width: 560px;">

  <div class="d-flex justify-content-between align-items-baseline mb-1">
    <h2 style="font-size: 18px; font-weight: 700;">Log Payment</h2>
    <a href="{{ url_for('caretaker.payment_activity', property_id=property.id) }}"
       style="font-size: 13px; color: var(--ink-3); text-decoration: none;">Payment history →</a>
  </div>
  <p style="font-size: 13px; color: var(--ink-3); margin-bottom: 24px;">
    Paste the tenant's M-Pesa message to record their payment.
  </p>

  <form method="POST">
    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Unit</label>
      <select name="unit_id" required
              style="width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--surface);">
        <option value="">— Select unit —</option>
        {% for u in units %}
        <option value="{{ u.id }}">{{ u.unit_number }}{% if u.tenant_name %} — {{ u.tenant_name }}{% endif %}</option>
        {% endfor %}
      </select>
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">M-Pesa Message</label>
      <textarea name="message" rows="5" required placeholder="Paste the full M-Pesa SMS here..."
                style="width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: monospace; background: var(--surface); resize: vertical;"></textarea>
      <div style="font-size: 12px; color: var(--ink-3); margin-top: 4px;">
        Just the reference code works too, e.g. <code>SG12ABC34D</code>
      </div>
    </div>

    <button type="submit"
            style="padding: 9px 22px; background: var(--ink); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;">
      Log Payment
    </button>
  </form>

</div>
{% endblock %}
