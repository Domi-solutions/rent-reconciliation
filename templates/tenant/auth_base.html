<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sign in{% endblock %} — Domi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Self-contained so sign-in still looks right if the Bootstrap CDN does not load on a weak connection */
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #f6f5f1; min-height: 100vh; margin: 0; color: #1b1b1a;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
    .form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
    .form-control { display: block; width: 100%; padding: 12px 14px; font-size: 18px; border: 1px solid #cfcdc6; border-radius: 12px; background: #fff; }
    .form-control:focus { outline: none; border-color: #1b1b1a; box-shadow: 0 0 0 3px rgba(27,27,26,.12); }
    .mb-3 { margin-bottom: 16px; } .mb-4 { margin-bottom: 22px; }
    .btn-dark { background: #1b1b1a; color: #fff; border: none; cursor: pointer; }
    .alert-danger { background: #fdeceb; color: #9b1c1c; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
    a { color: #1b1b1a; }
    .text-muted { color: #8a8a84; }
    .auth { max-width: 400px; margin: 0 auto; padding: 48px 20px 32px; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand b { font-size: 22px; } .brand div { font-size: 13px; color: #718096; margin-top: 2px; }
    .box { background: #fff; border: 1px solid #e7e6e1; border-radius: 16px; padding: 24px; }
    .box h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .box p.lead { font-size: 14px; color: #5b5b57; margin-bottom: 18px; }
    .pin { font-size: 28px; letter-spacing: 12px; text-align: center; font-variant-numeric: tabular-nums; }
    .code { font-size: 24px; letter-spacing: 8px; text-align: center; font-variant-numeric: tabular-nums; }
    .btn-go { width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border-radius: 12px; }
    .alt { text-align: center; margin-top: 16px; font-size: 14px; }
    .who { background: #f6f5f1; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="auth">
    <div class="brand"><b>Domi</b><div>Tenant account</div></div>
    <div class="box">{% block content %}{% endblock %}</div>
    <div style="margin-top:14px">{% include 'partials/guide.html' %}</div>
    {% block below %}{% endblock %}
  </div>
</body>
</html>
