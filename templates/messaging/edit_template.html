{% extends "base.html" %}
{% block title %}Edit template — {{ property.name }}{% endblock %}
{% block content %}
<h1 class="mb-2">Edit template</h1>
<p class="text-muted mb-4">{{ template.template_key }}</p>
<form method="post" action="{{ url_for('messaging.edit_template', template_id=template.id) }}">
  <div class="mb-3">
    <label class="form-label">Subject</label>
    <input type="text" class="form-control" name="subject" value="{{ template.subject }}" required maxlength="200">
  </div>
  <div class="mb-3">
    <label class="form-label">Body</label>
    <textarea class="form-control" name="body" rows="6">{{ template.body }}</textarea>
  </div>
  <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="enabled" value="1" id="enabled" {% if template.enabled %}checked{% endif %}>
      <label class="form-check-label" for="enabled">Enabled</label>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('messaging.templates_list') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
