# Domi — Database Schema Registry
# Ground truth for all tables and columns.
# Agents: use this file for precise column lookups. Do NOT rely on CLAUDE.md prose for column names.
# When adding a table or column: update this file in the same commit as the migration.
# status: live = deployed to production | planned = not yet built

tables:

  organizations:
    status: live
    migration: migrate_add_orgs (Phase I)
    note: "One org per PMO / property management company. First customer: Mowin Apartments."
    columns:
      id: {type: TEXT, pk: true}
      name: {type: TEXT, required: true}
      slug: {type: TEXT, unique: true, nullable: true, note: "URL-safe identifier; auto-generated at creation if not provided"}
      contact_email: {type: TEXT, unique: true, nullable: true, note: "Org admin login email. Login query: WHERE LOWER(contact_email) = ? AND is_active = 1. Editable via /platform/orgs/<id>/edit or /platform/orgs/<id>/set-email."}
      contact_phone: {type: TEXT, nullable: true}
      admin_password_hash: {type: TEXT, nullable: true, note: "Org admin login password. Set via /platform/orgs/<id>/set-password. NULL = no password set yet."}
      platform_fee_rate: {type: REAL, default: 0.01, note: "Domi fee; silent in float; never shown in org admin UI"}
      is_active: {type: INTEGER, default: 1, note: "1=active, 0=inactive. Login blocked when 0. Toggled via /platform/orgs/<id>/toggle."}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  persons:
    status: live
    migration: migrate_add_persons (Phase I)
    note: "Individual owner login accounts. Separate from org admin. One person can be linked to multiple owners across orgs. Auth: persons.email + password_hash."
    columns:
      id: {type: TEXT, pk: true}
      owner_id: {type: TEXT, fk: owners.id, note: "Primary owner record this person authenticates on behalf of"}
      name: {type: TEXT, required: true}
      email: {type: TEXT, unique: true, required: true, note: "Login credential. Immutable once password_hash is set (account activated)."}
      password_hash: {type: TEXT, note: "Set during activation flow. NULL = not yet activated."}
      activation_token: {type: TEXT, unique: true, note: "Short-lived token sent in activation link. Cleared after activation."}
      otp_code: {type: TEXT, note: "6-digit email OTP in transit. Cleared after verification."}
      otp_expires_at: {type: TIMESTAMP, note: "OTP expiry (10 minutes). After expiry, owner must resend."}
      phone_verified: {type: INTEGER, default: 0}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  properties:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      name: {type: TEXT, required: true}
      address: {type: TEXT}
      owner_name: {type: TEXT}
      owner_phone: {type: TEXT}
      owner_email: {type: TEXT}
      owner_id: {type: TEXT, fk: owners.id, added_by: migrate_add_owners}
      rent_due_day: {type: INTEGER, default: 5, added_by: migrate_add_rent_due_day}
      management_fee_rate: {type: REAL, default: 0.08, added_by: migrate_add_payment_transactions}
      water_rate: {type: REAL, default: 300, added_by: migrate_add_water_readings, note: "KES per unit consumed; property-level default; snapshotted onto water_uploads at time of reading"}
      status: {type: TEXT, default: active}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  units:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      unit_number: {type: TEXT, required: true}
      monthly_rent: {type: DECIMAL(10,2), required: true}
      service_charge: {type: DECIMAL(10,2), default: 0}
      apartment_size: {type: TEXT, default: '', added_by: migrate_add_apartment_size}
      status: {type: TEXT, default: occupied, values: [occupied, vacant, owner_use, short_term], note: "'office' renamed to 'owner_use' via migrate_rename_office_to_owner_use. 'occupied' only set by move-in flow — never via direct edit. 'owner_use' and 'short_term' excluded from rentable count and charge generation."}
      status_changed_at: {type: TIMESTAMP, added_by: migrate_add_status_changed_at}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    constraints:
      - UNIQUE(property_id, unit_number)

  tenants:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      unit_id: {type: TEXT, fk: units.id}
      name: {type: TEXT, required: true}
      phone: {type: TEXT}
      email: {type: TEXT}
      move_in_date: {type: DATE}
      move_out_date: {type: DATE}
      status: {type: TEXT, default: active, values: [active, departed, inactive], note: "departed = moved out with remaining debt (portal preserved); inactive = settled/written-off (access_token cleared)"}
      access_token: {type: TEXT, unique: true, added_by: migrate_add_tenant_access_token}
      language_preference: {type: TEXT, values: [en, sw, null], note: "NULL triggers language prompt on first inbound", added_by: migrate_add_language_preference}
      flagged: {type: INTEGER, default: 0, added_by: migrate_add_claim_flagging, note: "set=1 when a payment claim is flagged (ref not in bank); future claims lose pending-state treatment; admin clears manually"}
      portal_pin_hash: {type: TEXT, nullable: true, added_by: migrate_add_payment_transactions, note: "werkzeug pbkdf2 hash of 4-digit portal PIN for payment tab"}
      deposit_paid: {type: DECIMAL(12,2), default: 0, added_by: migrate_add_deposit_paid, note: "Deposit collected at move-in; pre-fills move-out deposit_held field"}
      move_in_notes: {type: TEXT, nullable: true, added_by: migrate_add_deposit_paid, note: "Optional admin notes recorded at move-in"}
      short_code: {type: TEXT, unique: true, nullable: true, added_by: migrate_add_tenant_short_code, note: "6-char alphanumeric short code for SMS portal links. /t/<code> redirects to /tenant/<access_token>. Generated at move-in. Existing rows backfilled at migration."}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  bank_statements:
    status: live
    migration: schema.sql (base) + migrate_add_org_scoped_statements + migrate_bank_statements_nullable_property
    note: "Org-scoped. Statements belong to the org (bank account), not a property. property_id is nullable — set only when admin explicitly tags a statement to one property at upload; NULL means org-wide. Both upload and verify_payments are always org-scoped. Statements list shows all org statements regardless of which property the admin is viewing. Per-statement coverage badge shows which properties have verified payments assigned."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: false, note: "Optional. NULL = org-wide (all properties). Non-null = admin tagged at upload for convenience; does NOT restrict verify_payments scope — all pending claims across the org are always checked."}
      org_id: {type: TEXT, fk: organizations.id, added_by: migrate_add_org_scoped_statements, note: "Set on all new uploads; primary query key; always query by this for multi-property orgs"}
      bank_format: {type: TEXT, added_by: migrate_add_org_scoped_statements, values: [cooperative, family_bank, national_bank, tabular_kes, scanned, unknown], note: "Detected format; stored so reparse can skip re-detection. family_bank uses cooperative parser. national_bank uses tabular parser. scanned = image-only PDF parsed via Claude Haiku vision API."}
      filename: {type: TEXT, required: true}
      file_path: {type: TEXT, required: true}
      period_start: {type: DATE}
      period_end: {type: DATE}
      opening_balance: {type: DECIMAL(12,2)}
      closing_balance: {type: DECIMAL(12,2)}
      total_transactions: {type: INTEGER}
      rent_transactions: {type: INTEGER}
      status: {type: TEXT, default: active, values: [active, parse_failed, superseded]}
      uploaded_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    indexes:
      - idx_stmts_org ON (org_id)

  bank_transactions:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      statement_id: {type: TEXT, fk: bank_statements.id, required: true}
      mpesa_ref: {type: TEXT}
      amount: {type: DECIMAL(10,2), required: true}
      txn_type: {type: TEXT, required: true}
      sender_name: {type: TEXT}
      txn_date: {type: DATE}
      raw_text: {type: TEXT}
      unit_hint: {type: TEXT, added_by: migrate_add_unit_hint}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
      ignored: {type: INTEGER, default: 0, note: "1 = ignored from workflow unassigned count; row not deleted; still assignable", added_by: migrate_add_bank_txn_ignored}
      ignored_at: {type: TIMESTAMP, added_by: migrate_add_bank_txn_ignored}
      ignored_reason: {type: TEXT, added_by: migrate_add_bank_txn_ignored}
    indexes:
      - idx_bank_txn_ref ON (mpesa_ref)
      - idx_bank_txn_stmt ON (statement_id)
      - idx_bank_txn_date ON (txn_date) — added by migrate_add_bank_txn_date_index; avoids strftime full-table scans on period queries

  payment_claims:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      mpesa_ref: {type: TEXT, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      claimed_amount: {type: DECIMAL(10,2)}
      raw_message: {type: TEXT}
      source: {type: TEXT, default: web, values: [web, caretaker, tenant, whatsapp, sms], note: "tenant = self-reported via /tenant/<token>/report-payment"}
      status: {type: TEXT, default: pending, values: [pending, verified, flagged], note: "flagged is permanent — use caretaker_confirmed/admin_cleared for resolution, never change status back"}
      verified_at: {type: TIMESTAMP}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
      mpesa_date: {type: DATE, nullable: true, added_by: migrate_add_claim_resolution, note: "parsed from M-Pesa message timestamp"}
      mpesa_period: {type: TEXT, nullable: true, added_by: migrate_add_claim_resolution, note: "YYYY-MM derived from mpesa_date; used for period-based fraud detection"}
      flag_reason: {type: TEXT, nullable: true, added_by: migrate_add_claim_flagging, values: [ref_not_found, stale_30_days]}
      flagged_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_claim_flagging}
      caretaker_confirmed: {type: INTEGER, default: 0, added_by: migrate_add_claim_resolution}
      caretaker_note: {type: TEXT, nullable: true, added_by: migrate_add_claim_resolution}
      caretaker_confirmed_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_claim_resolution}
      admin_cleared: {type: INTEGER, default: 0, added_by: migrate_add_claim_resolution}
      admin_note: {type: TEXT, nullable: true, added_by: migrate_add_claim_resolution, note: "mandatory min 10 chars when clearing"}
      admin_cleared_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_claim_resolution}
      departed_tenant_id: {type: TEXT, fk: tenants.id, nullable: true, added_by: migrate_add_tenant_departures, note: "Set when caretaker submits claim in 'Departed tenant' mode; links post-departure payment to former tenant"}
    constraints:
      - UNIQUE(property_id, mpesa_ref)
      - idx_claim_period ON (mpesa_period)

  payments:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      claim_id: {type: TEXT, fk: payment_claims.id}
      bank_txn_id: {type: TEXT, fk: bank_transactions.id, note: "NULL for Daraja/Pesapal payments"}
      statement_id: {type: TEXT, fk: bank_statements.id, note: "NULL for Daraja/Pesapal payments"}
      amount: {type: DECIMAL(10,2), required: true}
      payment_date: {type: DATE, required: true}
      assignment_type: {type: TEXT, required: true, values: [verified, manual, daraja, pesapal]}
      assignment_reason: {type: TEXT}
      assigned_by: {type: TEXT}
      source: {type: TEXT, default: manual, values: [manual, daraja, pesapal], added_by: migrate_add_payment_transactions}
      notes: {type: TEXT, nullable: true, added_by: migrate_add_payment_notes, note: "admin annotation; writes to audit_log + platform_shadow_log"}
      notes_updated_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_payment_notes}
      caretaker_note: {type: TEXT, nullable: true, added_by: migrate_add_payment_notes, note: "caretaker annotation on amount-mismatch payments; writes to audit_log + platform_shadow_log"}
      caretaker_note_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_payment_notes}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  rent_charges:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      period: {type: TEXT, required: true, note: "YYYY-MM or 'ARREARS'"}
      charge_type: {type: TEXT, default: rent, values: [rent, service, water], added_by: migrate_add_charge_type}
      amount: {type: DECIMAL(10,2), required: true}
      due_date: {type: DATE, added_by: migrate_set_rent_charge_due_dates}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    constraints:
      - UNIQUE(unit_id, period, charge_type)

  payment_allocations:
    status: live
    migration: migrate_add_payment_allocations
    note: "FIFO allocation records. ON DELETE CASCADE on payment_id."
    columns:
      id: {type: TEXT, pk: true}
      payment_id: {type: TEXT, fk: "payments(id) ON DELETE CASCADE", required: true}
      charge_id: {type: TEXT, fk: rent_charges.id, required: true}
      amount: {type: DECIMAL(10,2), required: true}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  audit_log:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: INTEGER, pk: true, autoincrement: true}
      timestamp: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
      user_id: {type: TEXT}
      action: {type: TEXT, required: true}
      entity_type: {type: TEXT}
      entity_id: {type: TEXT}
      details: {type: TEXT}
      ip_address: {type: TEXT}

  owners:
    status: live
    migration: migrate_add_owners + migrate_add_payout_fields + migrate_add_owner_org_id
    note: "payout_mpesa is OWNER-WRITE-ONLY via portal OTP flow. Admin has zero write path to this field. See payout security architecture in CLAUDE.md. org_id scopes owners to their org for multi-tenant isolation."
    columns:
      id: {type: TEXT, pk: true}
      name: {type: TEXT, required: true}
      phone: {type: TEXT, note: "Contact phone — separate from payout_mpesa"}
      email: {type: TEXT}
      password_hash: {type: TEXT}
      access_token: {type: TEXT, unique: true}
      notes: {type: TEXT}
      org_id: {type: TEXT, fk: organizations.id, nullable: true, added_by: migrate_add_owner_org_id, note: "Multi-tenant isolation. Backfilled from property_owners → properties at migration. All manage_owners queries must filter WHERE o.org_id = ?."}
      payout_mpesa: {type: TEXT, nullable: true, added_by: migrate_add_payout_fields, note: "Owner's M-Pesa number for disbursements. Set only via OTP-verified portal flow. Admin cannot write this field."}
      payout_confirmed: {type: INTEGER, default: 0, added_by: migrate_add_payout_fields, note: "1 = OTP verified. Disbursements blocked until 1 AND payout_active_at <= now()"}
      payout_active_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_payout_fields, note: "48h hold after OTP confirmation. Disbursements blocked until this timestamp passes."}
      payout_otp: {type: TEXT, nullable: true, added_by: migrate_add_payout_fields, note: "6-digit OTP in transit. Cleared after verification or expiry."}
      payout_otp_expires_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_payout_fields, note: "OTP expiry (10 minutes from generation). After expiry, owner must request new OTP."}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    indexes:
      - idx_owners_org ON (org_id) — added by migrate_add_owner_org_id

  property_owners:
    status: live
    migration: migrate_add_property_owners + migrate_add_primary_owner
    note: "M:M junction — one owner can have multiple properties. First owner assigned to a property is auto-marked is_primary=1."
    columns:
      property_id: {type: TEXT, fk: properties.id}
      owner_id: {type: TEXT, fk: owners.id}
      is_primary: {type: INTEGER, default: 0, added_by: migrate_add_primary_owner, note: "1 = first/primary owner for this property. Cannot be removed by admin — requires platform intervention. Auto-set on first assignment. Existing rows migrated using MIN(rowid) per property."}
    constraints:
      - PRIMARY KEY(property_id, owner_id)

  messages:
    status: live
    migration: migrate_add_messaging
    note: "Per-tenant in-app messages. batch_id groups broadcasts."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      tenant_id: {type: TEXT, fk: tenants.id, required: true}
      batch_id: {type: TEXT}
      subject: {type: TEXT, required: true}
      body: {type: TEXT, required: true}
      template_body: {type: TEXT, added_by: migrate_add_template_body, note: "Unsubstituted template for broadcasts"}
      message_type: {type: TEXT, required: true, values: [reminder, broadcast, notice, checkin]}
      delivery_channel: {type: TEXT, default: portal, added_by: migrate_add_sms_delivery}
      delivery_status: {type: TEXT, default: delivered}
      read_at: {type: TIMESTAMP}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  message_templates:
    status: live
    migration: migrate_add_messaging
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, nullable: true, note: "NULL = system default"}
      template_key: {type: TEXT, required: true}
      subject: {type: TEXT, required: true}
      body: {type: TEXT, required: true}
      enabled: {type: INTEGER, default: 1}
      created_at: {type: TIMESTAMP}
      updated_at: {type: TIMESTAMP}
    constraints:
      - UNIQUE(property_id, template_key)

  reminder_settings:
    status: live
    migration: migrate_add_messaging
    note: "Legacy hardcoded reminder keys. Coexists with reminder_schedules."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      template_key: {type: TEXT, required: true}
      days_before_due: {type: INTEGER, required: true}
      enabled: {type: INTEGER, default: 1}
      created_at: {type: TIMESTAMP}
    constraints:
      - UNIQUE(property_id, template_key)

  reminder_schedules:
    status: live
    migration: migrate_add_reminder_schedules
    note: "Flexible per-property schedules. Additive to reminder_settings."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      label: {type: TEXT}
      template_key: {type: TEXT, required: true}
      days_before_due: {type: INTEGER, required: true}
      send_to: {type: TEXT, default: all, values: [all, arrears]}
      enabled: {type: INTEGER, default: 1}

  owner_messages:
    status: live
    migration: migrate_add_owner_messages
    note: "Owner portal inbox. SELECT all columns — SQLite silently returns NULL for omitted ones."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id}
      owner_id: {type: TEXT, fk: owners.id}
      subject: {type: TEXT}
      body: {type: TEXT}
      template_body: {type: TEXT, note: "Unsubstituted template for broadcasts"}
      message_type: {type: TEXT, values: [notification, broadcast, reminder]}
      channel: {type: TEXT}
      recipient_count: {type: INTEGER}
      sent_by: {type: TEXT, note: "Caretaker name, 'Admin', or 'System'"}
      read_at: {type: TIMESTAMP}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  caretakers:
    status: live
    migration: migrate_add_caretakers
    note: "Named caretaker accounts per property. Name doubles as login username."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      name: {type: TEXT, required: true}
      phone: {type: TEXT}
      password_hash: {type: TEXT}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  maintenance_issues:
    status: live
    migration: migrate_add_maintenance
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      unit_id: {type: TEXT, fk: units.id}
      source: {type: TEXT, values: [tenant, caretaker]}
      raised_by_tenant_id: {type: TEXT, fk: tenants.id}
      category: {type: TEXT}
      description: {type: TEXT}
      priority: {type: TEXT, default: routine, values: [urgent, routine], status: planned}
      status: {type: TEXT, default: open, values: [open, resolved]}
      resolved_at: {type: TIMESTAMP}
      resolved_note: {type: TEXT}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  report_settings:
    status: live
    migration: schema.sql (base)
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, unique: true}
      frequency: {type: TEXT, default: monthly}
      send_day: {type: INTEGER, default: 1}
      recipient_email: {type: TEXT}
      recipient_phone: {type: TEXT}
      enabled: {type: INTEGER, default: 0}
      last_sent_at: {type: TIMESTAMP}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  landlord_reports:
    status: live
    migration: migrate_add_landlord_reports + migrate_add_report_refresh_fields
    note: "Live/frozen architecture: reports < 3 months old regenerate on every view; ≥3 months served from stored report_data JSON. _flag_stale_reports() in app.py sets needs_refresh=1 after statement upload and verify_payments."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      period_start: {type: DATE, required: true}
      period_end: {type: DATE, required: true}
      report_type: {type: TEXT, default: manual}
      report_data: {type: TEXT, required: true, note: "JSON blob"}
      sent_via: {type: TEXT}
      sent_to: {type: TEXT}
      sent_at: {type: TIMESTAMP}
      needs_refresh: {type: INTEGER, default: 0, added_by: migrate_add_report_refresh_fields, note: "1 = new bank data arrived for this period; admin can force-refresh"}
      refresh_reason: {type: TEXT, nullable: true, added_by: migrate_add_report_refresh_fields}
      refreshed_at: {type: TIMESTAMP, nullable: true, added_by: migrate_add_report_refresh_fields}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  balance_snapshots:
    status: live
    migration: migrate_add_balance_snapshots
    note: "Daily per-unit balance snapshots. Prerequisite for weekly digest arrears comparison."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      snapshot_date: {type: TEXT, required: true, note: "YYYY-MM-DD"}
      balance: {type: REAL, required: true}
      total_charged: {type: REAL, required: true}
      total_paid: {type: REAL, required: true}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    constraints:
      - UNIQUE(unit_id, snapshot_date)

  inbound_messages:
    status: live
    migration: migrate_add_inbound_messages
    note: "Every inbound message lands here first. Processing is always async."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT}
      sender_phone: {type: TEXT, required: true}
      sender_role: {type: TEXT, values: [tenant, caretaker, owner, admin, unknown]}
      sender_entity_id: {type: TEXT}
      raw_body: {type: TEXT, required: true}
      channel: {type: TEXT, required: true, values: [sms, whatsapp]}
      received_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
      processed_at: {type: TIMESTAMP}
      classified_intent: {type: TEXT}
      confidence: {type: REAL}
      action_taken: {type: TEXT}
      response_sent: {type: TEXT}

  inbound_sessions:
    status: live
    migration: migrate_add_inbound_sessions
    note: "Conversation state within 24h window. Resolves yes/no/skip replies."
    columns:
      phone: {type: TEXT, pk: true}
      property_id: {type: TEXT}
      last_intent: {type: TEXT}
      awaiting_confirmation: {type: TEXT}
      context_json: {type: TEXT}
      expires_at: {type: TIMESTAMP}

  checkin_responses:
    status: live
    migration: migrate_add_checkin_responses
    columns:
      id: {type: TEXT, pk: true}
      tenant_id: {type: TEXT, fk: tenants.id, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      period: {type: TEXT, required: true, note: "YYYY-MM"}
      numeric_response: {type: INTEGER, values: [1, 2, 3]}
      free_text: {type: TEXT}
      classified_category: {type: TEXT, values: [maintenance, noise, security, water, general, null]}
      received_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  payment_transactions:
    status: live
    migration: migrate_add_payment_transactions
    note: "Raw Daraja/Pesapal callbacks before processing. UNIQUE on external_reference for deduplication."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT}
      unit_id: {type: TEXT, fk: units.id}
      tenant_id: {type: TEXT, fk: tenants.id}
      source: {type: TEXT, required: true, values: [daraja, pesapal, manual]}
      external_reference: {type: TEXT, unique: true, note: "checkout_request_id or Pesapal ref; deduplication key"}
      phone: {type: TEXT}
      amount: {type: REAL, required: true}
      currency: {type: TEXT, default: KES}
      raw_callback: {type: TEXT, note: "Full JSON blob from provider"}
      received_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
      processing_status: {type: TEXT, default: pending, values: [pending, completed, failed]}
      processed_at: {type: TIMESTAMP}
      error_detail: {type: TEXT}
      payment_id: {type: TEXT, fk: payments.id, note: "Set when processed successfully"}

  disbursements:
    status: live
    migration: migrate_add_payment_transactions
    note: "Landlord payout records. One row per disbursement run per property."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      period: {type: TEXT, required: true}
      total_collected: {type: REAL, required: true}
      fee_rate: {type: REAL, required: true}
      fee_amount: {type: REAL, required: true}
      net_amount: {type: REAL, required: true}
      status: {type: TEXT, default: pending, values: [pending, processing, completed, failed]}
      method: {type: TEXT, values: [mpesa_b2c, bank_transfer]}
      recipient_account: {type: TEXT}
      daraja_transaction_id: {type: TEXT}
      disbursed_at: {type: TIMESTAMP}
      notes: {type: TEXT}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

  statement_parse_errors:
    status: live
    migration: migrate_add_statement_parse_errors
    note: "Every parse failure is logged here. Surfaced in admin review (Parse Errors tab) and platform dashboard (7-day count)."
    columns:
      id: {type: TEXT, pk: true}
      org_id: {type: TEXT, fk: organizations.id, required: true}
      statement_id: {type: TEXT, fk: bank_statements.id, note: "NULL if error occurred before statement row created"}
      filename: {type: TEXT, required: true}
      file_path: {type: TEXT, note: "Stored path — used by platform PDF download route"}
      bank_format: {type: TEXT, values: [cooperative, tabular_kes, unknown]}
      error_type: {type: TEXT, required: true, values: [transaction_row, validation, format_unknown, fatal]}
      error_message: {type: TEXT}
      raw_text: {type: TEXT, note: "Raw PDF row text that failed to parse — shown in collapsible in UI"}
      page_number: {type: INTEGER}
      txn_index: {type: INTEGER}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    indexes:
      - idx_spe_org ON (org_id)
      - idx_spe_stmt ON (statement_id)
      - idx_spe_created ON (created_at)

  platform_shadow_log:
    status: live
    migration: migrate_add_platform_shadow_log
    note: "Agency-uneditable record of sensitive actions. Written by src/platform/guardian.py. Never exposed to org admin."
    columns:
      id: {type: TEXT, pk: true}
      org_id: {type: TEXT, fk: organizations.id}
      property_id: {type: TEXT, fk: properties.id}
      action: {type: TEXT, required: true}
      entity_type: {type: TEXT}
      entity_id: {type: TEXT}
      details: {type: TEXT}
      actor: {type: TEXT, default: agency}
      created_at: {type: DATETIME, default: CURRENT_TIMESTAMP}

  tenant_disputes:
    status: live
    migration: migrate_add_tenant_disputes
    note: "Tenant concerns submitted directly to Domi, bypassing the agency. POST /tenant/<token>/dispute. Visible only to platform team."
    columns:
      id: {type: TEXT, pk: true}
      tenant_id: {type: TEXT, required: true}
      property_id: {type: TEXT, required: true}
      org_id: {type: TEXT}
      subject: {type: TEXT}
      message: {type: TEXT, required: true}
      status: {type: TEXT, default: open, values: [open, resolved]}
      created_at: {type: DATETIME, default: CURRENT_TIMESTAMP}
      resolved_at: {type: DATETIME}
      resolution_note: {type: TEXT}

  platform_alerts:
    status: live
    migration: migrate_add_platform_alerts
    note: "Raised automatically on sensitive agency actions (owner_removed = critical; rent_changed >10% = warning/critical)."
    columns:
      id: {type: TEXT, pk: true}
      org_id: {type: TEXT}
      property_id: {type: TEXT}
      alert_type: {type: TEXT, required: true}
      details: {type: TEXT}
      severity: {type: TEXT, default: warning, values: [warning, critical]}
      status: {type: TEXT, default: open, values: [open, dismissed]}
      created_at: {type: DATETIME, default: CURRENT_TIMESTAMP}
      dismissed_at: {type: DATETIME}

  water_uploads:
    status: live
    migration: migrate_add_water_readings
    note: "One row per batch of meter readings. reading_period = month readings were taken (YYYY-MM). charge_period = month charges apply to (always reading_period + 1 month). rate is snapshotted from properties.water_rate at upload time."
    columns:
      id: {type: TEXT, pk: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      reading_period: {type: TEXT, required: true, note: "YYYY-MM when readings were taken (e.g. 2026-05)"}
      charge_period: {type: TEXT, required: true, note: "YYYY-MM when charges are billed (always reading_period + 1)"}
      unit_count: {type: INTEGER}
      total_amount: {type: REAL}
      rate: {type: REAL, note: "KES/unit consumed; snapshotted from properties.water_rate at upload time"}
      source: {type: TEXT, values: [admin_excel, caretaker_form]}
      submitted_by: {type: TEXT}
      submitted_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    constraints:
      - UNIQUE(property_id, charge_period) — prevents duplicate uploads per charge period

  water_readings:
    status: live
    migration: migrate_add_water_readings
    note: "One row per unit per upload. previous_reading auto-populated from last recorded current_reading for that unit."
    columns:
      id: {type: TEXT, pk: true}
      upload_id: {type: TEXT, fk: water_uploads.id, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      previous_reading: {type: REAL, required: true}
      current_reading: {type: REAL, required: true}
      units_consumed: {type: REAL, note: "current_reading − previous_reading"}
      rate: {type: REAL, note: "KES per unit; copied from water_uploads.rate"}
      amount: {type: REAL, note: "units_consumed × rate; written to rent_charges as charge_type='water'"}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    indexes:
      - idx_water_readings_upload ON (upload_id)
      - idx_water_readings_unit ON (unit_id)

  platform_outbox:
    status: live
    migration: migrate_add_platform_outbox
    note: "Every outbound message logged here regardless of delivery channel or status. Written by log_outbox() in src/messaging/outbox.py. Never used for business logic — audit/debug only. Surfaced at /platform/outbox."
    columns:
      id: {type: TEXT, pk: true}
      to_name: {type: TEXT}
      to_email: {type: TEXT}
      to_phone: {type: TEXT}
      channel: {type: TEXT, required: true, values: [sms, email, whatsapp, portal]}
      subject: {type: TEXT, note: "Email only"}
      body: {type: TEXT, required: true}
      status: {type: TEXT, default: simulated, values: [sent, failed, simulated], note: "simulated = no API configured; code visible for testing"}
      error: {type: TEXT, note: "Error message if status=failed"}
      org_id: {type: TEXT}
      property_id: {type: TEXT}
      message_type: {type: TEXT, note: "e.g. email_otp, owner_notification, sms_payment_confirmed"}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}
    indexes:
      - idx_outbox_created ON (created_at)
      - idx_outbox_channel ON (channel)

  tenant_departures:
    status: live
    migration: migrate_add_tenant_departures
    note: "One row per move-out. Snapshot of financial state at departure. debt_status drives post-departure workflow."
    columns:
      id: {type: TEXT, pk: true}
      tenant_id: {type: TEXT, fk: tenants.id, required: true}
      unit_id: {type: TEXT, fk: units.id, required: true}
      property_id: {type: TEXT, fk: properties.id, required: true}
      departure_date: {type: DATE, required: true}
      balance_at_departure: {type: DECIMAL(12,2), required: true, note: "Positive = arrears; negative = credit/overpayment"}
      deposit_held: {type: DECIMAL(12,2), default: 0}
      deposit_applied: {type: DECIMAL(12,2), default: 0, note: "min(deposit_held, arrears)"}
      deposit_refunded: {type: DECIMAL(12,2), default: 0, note: "max(deposit_held - arrears, 0)"}
      remaining_debt: {type: DECIMAL(12,2), default: 0, note: "max(arrears - deposit_held, 0)"}
      debt_status: {type: TEXT, default: none, values: [none, active, written_off], note: "none = settled; active = pursuing; written_off = irrecoverable"}
      write_off_note: {type: TEXT, nullable: true, note: "Required when debt_status = written_off"}
      admin_notes: {type: TEXT, nullable: true}
      created_at: {type: TIMESTAMP, default: CURRENT_TIMESTAMP}

views:
  unit_balances:
    status: live
    note: "Calculated view — never stored. Always use this for balance queries. Charges and payments are scoped to the current active tenant's move_in_date so a new tenant starts with a clean balance (no inherited history from previous tenant)."
    columns: [unit_id, property_id, unit_number, monthly_rent, tenant_id, tenant_name, tenant_phone, total_charged, total_paid, balance]
