<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenant Login — Domi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 400px;">
    <div class="text-center mb-4">
      <div style="font-size: 22px; font-weight: 700;">Domi</div>
      <div style="font-size: 13px; color: #718096; margin-top: 4px;">Tenant portal</div>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Phone number</label>
            <input type="tel" class="form-control" name="phone" placeholder="07xx xxx xxx" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3" style="font-size: 13px; color: #a0aec0;">
      You can also use the link sent to you by your property manager.
    </div>
  </div>
</body>
</html>
