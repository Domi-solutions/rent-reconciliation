<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Your Account — Domi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f7f8fa; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card-box { background: #fff; border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,.08); padding: 40px 36px; width: 100%; max-width: 420px; }
    .step-bar { display: flex; gap: 8px; margin-bottom: 28px; }
    .step { flex: 1; height: 4px; border-radius: 2px; background: #e2e8f0; }
    .step.active { background: #1a1a2e; }
    .step.done { background: #22c55e; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card-box">

    <div class="text-center mb-4">
      <div style="font-size: 20px; font-weight: 700; color: #1a1a2e;">Domi</div>
      <div style="font-size: 12px; color: #8a94a6; margin-top: 2px;">Owner portal</div>
    </div>

    {% if error and not person_name %}
      <div class="alert alert-danger">{{ error }}</div>
      <div class="text-center mt-3">
        <a href="{{ url_for('owner.login') }}" class="btn btn-outline-secondary btn-sm">Go to login</a>
      </div>
    {% else %}
      <div class="step-bar">
        <div class="step active"></div>
        <div class="step"></div>
      </div>
      <div style="font-size: 11px; color: #8a94a6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em;">Step 1 of 2</div>
      <div style="font-weight: 700; font-size: 18px; margin-bottom: 4px;">
        Welcome{% if person_name %}, {{ person_name }}{% endif %}
      </div>
      <div style="font-size: 14px; color: #718096; margin-bottom: 24px;">
        Set a password for your owner dashboard.
      </div>

      {% if error %}<div class="alert alert-danger py-2" style="font-size:13px;">{{ error }}</div>{% endif %}

      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">New password</label>
          <input type="password" class="form-control" name="password" required minlength="8"
                 autofocus placeholder="At least 8 characters">
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" style="font-size:13px;">Confirm password</label>
          <input type="password" class="form-control" name="confirm_password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100">Continue &rarr;</button>
      </form>
    {% endif %}

  </div>
</div>
</body>
</html>
