# Domi — Environment Variables Registry
# Ground truth for all environment variables.
# Agents: use this file to look up variable names — never guess or invent names.
# When adding a new variable: update this file and fly.toml secrets documentation.
# status: live = set on Fly.io production | sandbox = test credentials only | planned = not yet configured

variables:

  # --- Core App ---

  SECRET_KEY:
    status: live
    required: true
    description: "Flask session signing key. Must be set in production."
    dev_default: "dev-secret-change-in-production (hardcoded fallback)"
    set_via: "fly secrets set SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"

  DATABASE_PATH:
    status: live
    required: false
    description: "Absolute path to SQLite database file."
    dev_default: "data/dev.db (set by run_dev.sh)"
    production_default: "/data/rent.db"

  UPLOAD_FOLDER:
    status: live
    required: false
    description: "Path for uploaded bank statement PDFs."
    default: "data/statements"

  APP_BASE_URL:
    status: live
    required: false
    description: "Public base URL used for SMS links when no request context is available (e.g. scheduled jobs)."
    example: "https://rent-reconciliation.fly.dev"

  ENVIRONMENT:
    status: live
    required: false
    description: "Set to 'production' on Fly.io. Controls debug output and dev-only routes."
    values: [production, ""]
    set_via: "fly secrets set ENVIRONMENT=production"

  # --- Auth ---

  ADMIN_PASSWORD:
    status: live
    required: false
    description: "Admin portal master key. If unset, admin auth is disabled (dev mode)."
    note: "Must be set before any payment infrastructure goes live."

  PLATFORM_ADMIN_PASSWORD:
    status: live
    required: true
    description: "Platform (Domi internal) admin password. Controls access to /platform/* routes. Completely separate from org admin auth."
    set_via: "fly secrets set PLATFORM_ADMIN_PASSWORD=<password>"
    note: "Never leave unset in production — /platform/* would be open."

  VIEWER_PASSWORD:
    status: live
    required: false
    description: "Legacy owner viewer portal shared password. Superseded by persons-based login at /login."

  CARETAKER_PASSWORD:
    status: live
    required: false
    description: "Caretaker portal fallback password. Used if no named accounts exist in caretakers table."

  # --- SMS: Africa's Talking ---

  AT_USERNAME:
    status: live
    required: false
    description: "Africa's Talking username. Set to 'sandbox' for sandbox mode."
    default: sandbox
    values: [sandbox, "<production_username>"]

  AT_API_KEY:
    status: live
    required: false
    description: "Africa's Talking API key."

  AT_SENDER_ID:
    status: live
    required: false
    description: "SMS sender ID / shortcode (Africa's Talking)."

  AT_SMS_ENABLED:
    status: live
    required: false
    description: "Toggle SMS delivery globally. If 'false', send_sms() logs but does not call AT API. Useful for silencing SMS in dev without removing AT credentials."
    default: "true"
    values: ["true", "false"]

  AT_WHATSAPP_ENABLED:
    status: planned
    required: false
    description: "Toggle WhatsApp delivery. true/false."
    default: "false"

  # --- LLM: Anthropic ---

  ANTHROPIC_API_KEY:
    status: live
    required: false
    description: "Anthropic Claude API key. Required for intent classification and LLM-backed briefings."
    note: "Only used in src/agent/llm.py — never imported elsewhere."

  # --- Payment: Daraja (M-Pesa STK Push) ---

  DARAJA_CONSUMER_KEY:
    status: planned
    required: false
    description: "Daraja API consumer key (from Safaricom Developer Portal or Africa's Talking)."

  DARAJA_CONSUMER_SECRET:
    status: planned
    required: false
    description: "Daraja API consumer secret."

  DARAJA_PASSKEY:
    status: planned
    required: false
    description: "Lipa Na M-Pesa Online passkey for STK Push."

  DARAJA_SHORTCODE:
    status: planned
    required: false
    description: "M-Pesa Paybill number."

  DARAJA_CALLBACK_URL:
    status: planned
    required: false
    description: "Public URL for Daraja payment callbacks."
    example: "https://rent-reconciliation.fly.dev/inbound/payment/mpesa"

  DARAJA_ENV:
    status: planned
    required: false
    description: "Daraja environment selector."
    values: [sandbox, production]
    default: sandbox

  # --- Payment: Pesapal (Card) ---

  PESAPAL_CONSUMER_KEY:
    status: planned
    required: false
    description: "Pesapal API consumer key."

  PESAPAL_CONSUMER_SECRET:
    status: planned
    required: false
    description: "Pesapal API consumer secret."

  PESAPAL_ENV:
    status: planned
    required: false
    description: "Pesapal environment selector."
    values: [sandbox, production]
    default: sandbox

  # --- Email (SMTP) ---
  # All five vars must be set together. If any of SMTP_HOST / SMTP_USER / SMTP_PASSWORD is
  # missing, send_email() returns immediately with status='simulated' and logs to platform_outbox.
  # Implementation: src/messaging/email.py

  SMTP_HOST:
    status: live
    required: false
    description: "SMTP server hostname. Currently smtp.gmail.com (Gmail App Password)."

  SMTP_PORT:
    status: live
    required: false
    description: "SMTP server port."
    default: "587"

  SMTP_USER:
    status: live
    required: false
    description: "SMTP login username."

  SMTP_PASSWORD:
    status: live
    required: false
    description: "SMTP login password (Gmail App Password, not the account password)."

  SMTP_FROM:
    status: live
    required: false
    description: "From address on all outbound emails."
    default: "noreply@domi.co.ke"

  MAINTAINER_EMAIL:
    status: live
    required: false
    description: "Maintainer email address — receives weekly health digests, 500 error alerts, and scheduled-job failure alerts."
    example: "lincksmorara@gmail.com"
    note: "If unset, digest and error alerts are logged to platform_outbox as 'simulated' but not delivered."

  # --- Scheduled job heartbeats (dead-man's-switch) ---
  # No env var needed. Implementation: src/agent/heartbeat.py, listener
  # registered in app.py. Every APScheduler job pings a fixed per-job
  # healthchecks.io URL (PING_URLS dict in heartbeat.py — not secrets,
  # see file docstring) on success/failure. If a job stops running
  # entirely (process crash, scheduler dropped it on restart), no ping
  # arrives and healthchecks.io alerts MAINTAINER_EMAIL on its own — this
  # is what catches "silently stopped" failures the app itself can't
  # report because it isn't running. Project: lincksmorara@gmail.com on
  # healthchecks.io. To add a new job: create its check via the
  # dashboard or API and add the ping_url to PING_URLS.

  # --- Off-server database backups ---
  # Implementation: src/agent/backup.py, run daily by backup_job (app.py,
  # 02:00 UTC). Uses sqlite3's own backup API for a transactionally-
  # consistent snapshot, uploads to Cloudflare R2 (S3-compatible),
  # 30-day rolling retention. Wired into the same heartbeat/alert system
  # as other jobs — a failed or missed backup alerts MAINTAINER_EMAIL.

  R2_ENDPOINT_URL:
    status: live
    required: true
    description: "Cloudflare R2 S3-compatible endpoint. Format: https://<account-id>.r2.cloudflarestorage.com"

  R2_ACCESS_KEY_ID:
    status: live
    required: true
    description: "R2 API token Access Key ID, scoped to the domi-backups bucket (Object Read & Write)."

  R2_SECRET_ACCESS_KEY:
    status: live
    required: true
    description: "R2 API token Secret Access Key."

  R2_BUCKET_NAME:
    status: live
    required: true
    description: "R2 bucket holding backups."
    default: "domi-backups"
