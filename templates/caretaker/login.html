<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caretaker Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh;">
<div style="width: 100%; max-width: 360px; padding: 24px;">
  <div class="surface-card" style="padding: 32px;">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="font-size: 18px; font-weight: 700; color: var(--ink-1);">Caretaker Portal</div>
      <div style="font-size: 13px; color: var(--ink-3); margin-top: 4px;">Enter your access password</div>
    </div>
    {% if error %}
    <div class="alert alert-danger" style="font-size: 13px;">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label" style="font-size: 13px;">Password</label>
        <input type="password" name="password" class="form-control" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
