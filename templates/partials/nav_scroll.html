{# Portal tab bars (tenant, owner, caretaker). Wider screens: one scrolling row — bring the
   open page's tab into view and mark the edges that hide more tabs (faded in interface.css).
   Phones: the row is a menu behind partials/nav_toggle.html, labelled with the open page. #}
<script>
(function () {
  document.querySelectorAll('.viewer-header nav, .ct-header nav').forEach(function (nav) {
    var active = nav.querySelector('.active');
    if (active) {
      var left = active.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft;
      if (left + active.offsetWidth > nav.clientWidth - 48) {   /* hidden or under the fade */
        nav.scrollLeft = left - (nav.clientWidth - active.offsetWidth) / 2;
      }
    }
    function edges() {
      nav.classList.toggle('more-left', nav.scrollLeft > 4);
      nav.classList.toggle('more-right', nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 4);
    }
    edges();
    nav.addEventListener('scroll', edges, { passive: true });
    window.addEventListener('resize', edges);

    var header = nav.closest('header');
    var buttons = header ? header.querySelectorAll('.nav-toggle, .nav-current') : [];
    if (!buttons.length) return;
    var label = header.querySelector('.nav-toggle-label');
    if (active && label) label.textContent = active.textContent.trim().split('\n')[0].trim();
    function set(open) {
      header.classList.toggle('nav-open', open);
      buttons.forEach(function (b) { b.setAttribute('aria-expanded', open ? 'true' : 'false'); });
    }
    buttons.forEach(function (b) {
      b.addEventListener('click', function () { set(!header.classList.contains('nav-open')); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && header.classList.contains('nav-open')) { set(false); buttons[0].focus(); }
    });
  });
})();
</script>
